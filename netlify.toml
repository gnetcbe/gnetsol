# ================================
# NETLIFY FUNCTIONS (DO NOT REDIRECT)
# ================================

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ================================
# BUILD SETTINGS (NEXT.JS STATIC EXPORT)
# ================================

[build]
  command = "npm run build"
  publish = "out"
   functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"


# ================================
# FORCE NON-WWW → WWW (VERY IMPORTANT)
# ================================

[[redirects]]
  from = "https://g-netsolutions.com/*"
  to = "https://www.g-netsolutions.com/:splat"
  status = 301
  force = true


