# ================================
# BUILD SETTINGS (NEXT.JS STATIC EXPORT)
# ================================

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"


# ================================
# FORCE NON-WWW → WWW (VERY IMPORTANT)
# ================================

[[redirects]]
  from = "https://g-netsolutions.com/*"
  to = "https://www.g-netsolutions.com/:splat"
  status = 301
  force = true


